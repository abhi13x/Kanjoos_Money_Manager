name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow one concurrent deployment to avoid race conditions
concurrency:
  group: 'pages'
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1: Build the app and inject Vite secrets
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # ─── DEBUGGING: Directory structure ─────────────────────
      - name: Debug directory structure
        run: |
          echo "::group::📁 Debug: src/services/ contents"
          ls -la src/services/ || echo "src/services/ not found"
          echo "::endgroup::"

          echo "::group::🔍 Check for 'gDrive' folder"
          if [ -d "src/services/gDrive" ]; then
            echo "✅ src/services/gDrive exists"
            ls -la src/services/gDrive/
          else
            echo "❌ src/services/gDrive NOT found"
          fi
          echo "::endgroup::"

          echo "::group::🔍 Check for 'gdrive' folder"
          if [ -d "src/services/gdrive" ]; then
            echo "✅ src/services/gdrive exists"
            ls -la src/services/gdrive/
          else
            echo "❌ src/services/gdrive NOT found"
          fi
          echo "::endgroup::"

          echo "::group::📄 Check gdriveSync.ts"
          if [ -f "src/services/gdriveSync.ts" ]; then
            echo "✅ src/services/gdriveSync.ts exists"
            head -20 src/services/gdriveSync.ts
          else
            echo "❌ src/services/gdriveSync.ts NOT found"
          fi
          echo "::endgroup::"

      - name: Verify Secret Availability
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "❌ ERROR: VITE_GOOGLE_CLIENT_ID is empty or undefined!"
            exit 1
          else
            echo "✅ SUCCESS: VITE_GOOGLE_CLIENT_ID is set and passed to Vite."
          fi
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # JOB 2: Deploy compiled artifact to GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4